# Builds the mod and publishes a GitHub release when a version tag (v1.2.3) is pushed.
# The notes come from the matching section of CHANGELOG.md.
#
# Run it by hand from the Actions tab to try it without releasing anything:
# it only builds, uploads the jar to the run and shows the notes in the summary.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Releases are created as drafts on purpose: the in-game update check only sees published
  # releases, so nobody is told about a version until you press Publish after checking it.
  RELEASE_AS_DRAFT: 'true'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: read the version and check the tag
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          BASE=$(grep '^archives_base_name=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$MC" ]; then
            echo "::error::Could not read minecraft_version from gradle.properties"
            exit 1
          fi

          if [ "$EVENT" = "push" ]; then
            if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag '$TAG' is not in the form vMAJOR.MINOR.PATCH"
              exit 1
            fi
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag '$TAG' does not match mod_version '$VERSION' in gradle.properties. Bump the version first."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::Tag '$TAG' is not on master. Only tag commits that are merged into master."
              exit 1
            fi
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "::error::A release for '$TAG' already exists. Do not create releases by hand, only push the tag."
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=build/libs/$BASE-$VERSION.jar" >> "$GITHUB_OUTPUT"
          echo "title=SkyBatuhan v$VERSION for $MC" >> "$GITHUB_OUTPUT"
          echo "Release title: SkyBatuhan v$VERSION for $MC" >> "$GITHUB_STEP_SUMMARY"

      - name: extract the release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          awk -v ver="$VERSION" '
            { sub(/\r$/, "") }
            $1 == "##" && $2 == ver { found = 1; next }
            found && $1 == "##" { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no notes under '## $VERSION'. Add the section before tagging."
            exit 1
          fi

          {
            echo "### Release notes for $VERSION"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: check the jar
        env:
          JAR: ${{ steps.meta.outputs.jar }}
        run: |
          if [ ! -f "$JAR" ]; then
            echo "::error::Expected $JAR was not built. Found:"
            ls -la build/libs/
            exit 1
          fi

      - name: upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: skybatuhan-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.jar }}

      - name: create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.meta.outputs.title }}
          JAR: ${{ steps.meta.outputs.jar }}
        run: |
          set -euo pipefail

          # Link to the comparison with the previous release (nothing to link for the first one)
          PREVIOUS=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            {
              echo
              echo "**Full Changelog**: https://github.com/$GH_REPO/compare/$PREVIOUS...$TAG"
            } >> release-notes.md
          fi

          FLAGS=(--verify-tag --latest --title "$TITLE" --notes-file release-notes.md)
          if [ "$RELEASE_AS_DRAFT" = "true" ]; then
            FLAGS+=(--draft)
          fi

          gh release create "$TAG" "$JAR" "${FLAGS[@]}"